# Party, challenge, and social-provider configuration.

# ---------- Parties ----------
Party:
  Max-Size: 16
  Invite-Timeout-Seconds: 60

# ---------- Direct duel challenges ----------
Challenges:
  # Pending challenges are token-expired after this many seconds.
  Timeout-Seconds: 60
  Gui:
    Title: '&8Challenge <player> &7(<page>/<pages>)'
    Kit-Name: '&a<kit>'
    Kit-Lore:
      - '&7Challenge &f<player>'
      - '&eClick to send'
    Previous: '&ePrevious page'
    Next: '&eNext page'
    Info: '&bChallenge <player> &7(<page>/<pages>)'

# ---------- Leaderboard social scopes ----------
# Set Guild-Placeholder to a PlaceholderAPI value that returns one stable guild
# identifier. Players with the same non-empty value are treated as guild members.
Leaderboard-Filters:
  Guild-Placeholder: ''

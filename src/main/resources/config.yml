# HyXDuels core configuration
#
# Administrator-tuned definitions: plugins/HyXDuels/advanced/
# Runtime-owned state:             plugins/HyXDuels/data/
Config-Version: 1

# ---------- AdvancedSlimePaper worlds ----------
World-Loader:
  # Relative paths start at the Minecraft server's working directory.
  # This folder contains the immutable .slime templates used for arena resets.
  Slime-World-Directory: 'slime_worlds'

# ---------- Statistics storage ----------
Statistics:
  # Supported values: YAML, MYSQL, SQL.
  Storage-Type: 'YAML'

  # Used only when Storage-Type is MYSQL or SQL.
  SQL-Info:
    Address: 'localhost'
    Port: '3306'
    Database: 'hyxduels'
    Username: 'hyxduels'
    Password: ''

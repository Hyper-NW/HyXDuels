# Duels by alphatct3209
# Core world and storage settings. Advanced definitions live in advanced/; mutable state lives in data/.
World-Loader:
  # Directory containing immutable AdvancedSlimePaper .slime arena templates.
  # Every Spawn-One, Spawn-Two, and Lobby world is preloaded and must be ASP-managed.
  # An arena's two gameplay spawns must use the same map world; its lobby may differ.
  # Completed duel maps unload without saving and reload from the same template before reuse.
  # Relative paths are resolved from the server working directory.
  Slime-World-Directory: 'slime_worlds'
Statistics:
  Storage-Type: 'YAML'
  SQL-Info:
    Address: 'localhost'
    Port: '3306'
    Database: 'schema'
    Username: 'admin'
    Password: 'password'
